<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Hearts Live Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #0a0a1a;
        }
        
        #hearts-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="hearts-canvas"></canvas>

    <script>
        // Canvas setup
        const canvas = document.getElementById('hearts-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Configuration
        let config = {
            glowIntensity: 0.8,
            pulseSpeed: 0.5,
            movementSpeed: 0.3,
            colors: [
                {r: 255, g: 0, b: 128},    // Bright pink
                {r: 255, g: 20, b: 147},   // Deep pink
                {r: 255, g: 105, b: 180},  // Hot pink
                {r: 219, g: 112, b: 147},  // Pale violet red
                {r: 199, g: 21, b: 133},   // Medium violet red
                {r: 255, g: 0, b: 0},      // Red
                {r: 255, g: 69, b: 0}      // Orange red
            ]
        };

        // Heart class
        class Heart {
            constructor(gridX, gridY, gridCols, gridRows) {
                // Calculate base position in grid
                const cellWidth = width / gridCols;
                const cellHeight = height / gridRows;
                
                // Center of grid cell with random offset (but limited to stay within cell)
                const baseX = (gridX + 0.5) * cellWidth;
                const baseY = (gridY + 0.5) * cellHeight;
                
                // Random offset (limited to 30% of cell size)
                const maxOffsetX = cellWidth * 0.3;
                const maxOffsetY = cellHeight * 0.3;
                
                this.baseX = baseX;
                this.baseY = baseY;
                this.x = baseX + (Math.random() - 0.5) * maxOffsetX;
                this.y = baseY + (Math.random() - 0.5) * maxOffsetY;
                
                this.size = 25 + Math.random() * 30;
                this.color = config.colors[Math.floor(Math.random() * config.colors.length)];
                this.glowIntensity = 0.5 + Math.random() * 0.5;
                this.pulseSpeed = 0.3 + Math.random() * 0.7;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.015;
                
                // Subtle floating movement
                this.floatX = 0;
                this.floatY = 0;
                this.floatSpeedX = 0.1 + Math.random() * 0.2;
                this.floatSpeedY = 0.1 + Math.random() * 0.2;
                this.floatOffsetX = Math.random() * Math.PI * 2;
                this.floatOffsetY = Math.random() * Math.PI * 2;
                this.floatRadius = Math.min(cellWidth, cellHeight) * 0.1;
                
                this.pulseOffset = Math.random() * Math.PI * 2;
            }
            
            update(time) {
                // Subtle floating movement around base position
                this.floatX = Math.sin(time * this.floatSpeedX + this.floatOffsetX) * this.floatRadius;
                this.floatY = Math.cos(time * this.floatSpeedY + this.floatOffsetY) * this.floatRadius * 0.7;
                
                // Update rotation
                this.rotation += this.rotationSpeed;
                
                // Update pulse
                const pulse = Math.sin(time * this.pulseSpeed * config.pulseSpeed + this.pulseOffset) * 0.5 + 0.5;
                this.currentSize = this.size * (0.8 + pulse * 0.4);
                this.currentGlow = this.glowIntensity * config.glowIntensity * (0.7 + pulse * 0.3);
            }
            
            draw(ctx) {
                const drawX = this.baseX + this.floatX;
                const drawY = this.baseY + this.floatY;
                
                ctx.save();
                ctx.translate(drawX, drawY);
                ctx.rotate(this.rotation);
                this.drawHeart(ctx);
                ctx.restore();
            }
            
            drawHeart(ctx) {
                const size = this.currentSize;
                
                // Draw glow effect
                const gradient = ctx.createRadialGradient(0, 0, size * 0.5, 0, 0, size * 1.5);
                gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${0.7 * this.currentGlow})`);
                gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);
                
                ctx.beginPath();
                ctx.arc(0, 0, size * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Draw heart shape
                ctx.beginPath();
                
                // Top curves of heart
                ctx.moveTo(0, -size/2);
                ctx.bezierCurveTo(size/2, -size, size, -size/3, 0, size/2);
                ctx.bezierCurveTo(-size, -size/3, -size/2, -size, 0, -size/2);
                
                // Fill heart
                ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.9)`;
                ctx.fill();
                
                // Draw heart outline with glow
                ctx.lineWidth = 2;
                ctx.strokeStyle = `rgba(255, 255, 255, 0.8)`;
                ctx.stroke();
                
                // Draw digital/holographic pattern inside heart
                this.drawHolographicPattern(ctx, size);
            }
            
            drawHolographicPattern(ctx, size) {
                // Create a dotted/holographic pattern
                const patternSize = size / 8;
                const rows = Math.floor(size / patternSize);
                const cols = Math.floor(size / patternSize);
                
                ctx.save();
                
                // Clip to heart shape
                ctx.beginPath();
                ctx.moveTo(0, -size/2);
                ctx.bezierCurveTo(size/2, -size, size, -size/3, 0, size/2);
                ctx.bezierCurveTo(-size, -size/3, -size/2, -size, 0, -size/2);
                ctx.clip();
                
                // Draw dots
                ctx.fillStyle = `rgba(255, 255, 255, 0.3)`;
                for (let i = -cols/2; i < cols/2; i++) {
                    for (let j = -rows/2; j < rows/2; j++) {
                        // Only draw dots within heart shape
                        const x = i * patternSize;
                        const y = j * patternSize;
                        
                        // Simple check if point is within heart (approximation)
                        const distance = Math.sqrt(x*x + y*y);
                        if (distance < size/2) {
                            // Vary dot size for holographic effect
                            const dotSize = 1 + Math.sin(i + j + Date.now() * 0.001) * 0.5;
                            ctx.beginPath();
                            ctx.arc(x, y, dotSize, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
                
                ctx.restore();
            }
        }

        // Create hearts in a grid with random variations
        let hearts = [];
        
        function initHearts() {
            hearts = [];
            
            // Calculate grid based on screen size
            const aspectRatio = width / height;
            let cols, rows;
            
            if (aspectRatio > 1.5) { // Wide screen
                cols = Math.floor(width / 150);
                rows = Math.floor(cols / aspectRatio);
            } else if (aspectRatio < 0.7) { // Tall screen
                rows = Math.floor(height / 150);
                cols = Math.floor(rows * aspectRatio);
            } else { // Square-ish screen
                cols = Math.floor(width / 160);
                rows = Math.floor(height / 160);
            }
            
            // Ensure minimum number of hearts
            cols = Math.max(5, cols);
            rows = Math.max(4, rows);
            
            // Create hearts in grid positions
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    // Skip some random cells for more organic distribution (15% chance)
                    if (Math.random() > 0.15) {
                        hearts.push(new Heart(x, y, cols, rows));
                    }
                }
            }
            
            // If we have too few hearts, add some extras randomly
            const minHearts = Math.floor((width * height) / 15000);
            while (hearts.length < minHearts) {
                const randomCol = Math.floor(Math.random() * cols);
                const randomRow = Math.floor(Math.random() * rows);
                hearts.push(new Heart(randomCol, randomRow, cols, rows));
            }
            
            console.log(`Created ${hearts.length} hearts in ${cols}x${rows} grid`);
        }

        // Animation loop
        function animate(time) {
            // Convert time to seconds
            time *= 0.001;
            
            // Clear canvas with dark blue background
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, width, height);
            
            // Add a subtle cosmic gradient
            const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, Math.max(width, height) * 0.7);
            gradient.addColorStop(0, 'rgba(30, 20, 70, 0.2)');
            gradient.addColorStop(0.5, 'rgba(15, 10, 40, 0.3)');
            gradient.addColorStop(1, 'rgba(10, 10, 30, 0.5)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Update and draw hearts
            hearts.forEach(heart => {
                heart.update(time);
                heart.draw(ctx);
            });
            
            requestAnimationFrame(animate);
        }

        // Initialize and start animation
        initHearts();
        requestAnimationFrame(animate);
        
        // Re-initialize on resize
        window.addEventListener('resize', function() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initHearts();
        });
        
        // Add some subtle mouse interaction (optional, can remove if not wanted)
        let mouseX = width / 2;
        let mouseY = height / 2;
        
        window.addEventListener('mousemove', function(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        // Add touch support for mobile
        window.addEventListener('touchmove', function(e) {
            if (e.touches.length > 0) {
                mouseX = e.touches[0].clientX;
                mouseY = e.touches[0].clientY;
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</body>
</html>

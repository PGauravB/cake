<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Hearts Live Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #0a0a1a;
        }
        
        #hearts-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="hearts-canvas"></canvas>

    <script>
        // Canvas setup
        const canvas = document.getElementById('hearts-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Configuration
        let config = {
            glowIntensity: 0.8,
            pulseSpeed: 0.5,
            heartCount: 200,
            movementSpeed: 0.5,
            colors: [
                {r: 255, g: 0, b: 128},    // Bright pink
                {r: 255, g: 20, b: 147},   // Deep pink
                {r: 255, g: 105, b: 180},  // Hot pink
                {r: 219, g: 112, b: 147},  // Pale violet red
                {r: 199, g: 21, b: 133},   // Medium violet red
                {r: 255, g: 0, b: 0},      // Red
                {r: 255, g: 69, b: 0}      // Orange red
            ]
        };

        // Heart class
        class Heart {
            constructor() {
                this.reset();
                this.x = Math.random() * width;
                this.y = Math.random() * height;
            }
            
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = 20 + Math.random() * 40;
                this.color = config.colors[Math.floor(Math.random() * config.colors.length)];
                this.glowIntensity = 0.5 + Math.random() * 0.5;
                this.pulseDirection = Math.random() > 0.5 ? 1 : -1;
                this.pulseSpeed = 0.5 + Math.random() * 0.5;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.02;
                this.vx = (Math.random() - 0.5) * config.movementSpeed;
                this.vy = (Math.random() - 0.5) * config.movementSpeed;
                this.pulseOffset = Math.random() * Math.PI * 2;
            }
            
            update(time) {
                // Update position with boundary checking
                this.x += this.vx;
                this.y += this.vy;
                
                if (this.x < -this.size) this.x = width + this.size;
                if (this.x > width + this.size) this.x = -this.size;
                if (this.y < -this.size) this.y = height + this.size;
                if (this.y > height + this.size) this.y = -this.size;
                
                // Update rotation
                this.rotation += this.rotationSpeed;
                
                // Update pulse
                const pulse = Math.sin(time * this.pulseSpeed * config.pulseSpeed + this.pulseOffset) * 0.5 + 0.5;
                this.currentSize = this.size * (0.8 + pulse * 0.4);
                this.currentGlow = this.glowIntensity * config.glowIntensity * (0.7 + pulse * 0.3);
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                this.drawHeart(ctx);
                ctx.restore();
            }
            
            drawHeart(ctx) {
                const size = this.currentSize;
                
                // Draw glow effect
                const gradient = ctx.createRadialGradient(0, 0, size * 0.5, 0, 0, size * 1.5);
                gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${0.7 * this.currentGlow})`);
                gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);
                
                ctx.beginPath();
                ctx.arc(0, 0, size * 1.5, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Draw heart shape
                ctx.beginPath();
                
                // Top curves of heart
                ctx.moveTo(0, -size/2);
                ctx.bezierCurveTo(size/2, -size, size, -size/3, 0, size/2);
                ctx.bezierCurveTo(-size, -size/3, -size/2, -size, 0, -size/2);
                
                // Fill heart
                ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.9)`;
                ctx.fill();
                
                // Draw heart outline with glow
                ctx.lineWidth = 2;
                ctx.strokeStyle = `rgba(255, 255, 255, 0.8)`;
                ctx.stroke();
                
                // Draw digital/holographic pattern inside heart
                this.drawHolographicPattern(ctx, size);
            }
            
            drawHolographicPattern(ctx, size) {
                // Create a dotted/holographic pattern
                const patternSize = size / 8;
                const rows = Math.floor(size / patternSize);
                const cols = Math.floor(size / patternSize);
                
                ctx.save();
                
                // Clip to heart shape
                ctx.beginPath();
                ctx.moveTo(0, -size/2);
                ctx.bezierCurveTo(size/2, -size, size, -size/3, 0, size/2);
                ctx.bezierCurveTo(-size, -size/3, -size/2, -size, 0, -size/2);
                ctx.clip();
                
                // Draw dots
                ctx.fillStyle = `rgba(255, 255, 255, 0.3)`;
                for (let i = -cols/2; i < cols/2; i++) {
                    for (let j = -rows/2; j < rows/2; j++) {
                        // Only draw dots within heart shape
                        const x = i * patternSize;
                        const y = j * patternSize;
                        
                        // Simple check if point is within heart (approximation)
                        const distance = Math.sqrt(x*x + y*y);
                        if (distance < size/2) {
                            // Vary dot size for holographic effect
                            const dotSize = 1 + Math.sin(i + j + Date.now() * 0.001) * 0.5;
                            ctx.beginPath();
                            ctx.arc(x, y, dotSize, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
                
                ctx.restore();
            }
        }

        // Create hearts
        let hearts = [];
        function initHearts() {
            hearts = [];
            for (let i = 0; i < config.heartCount; i++) {
                hearts.push(new Heart());
            }
        }

        // Animation loop
        function animate(time) {
            // Convert time to seconds
            time *= 0.001;
            
            // Clear canvas with dark blue background
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, width, height);
            
            // Add a subtle cosmic gradient
            const gradient = ctx.createRadialGradient(width/2, height/2, 0, width/2, height/2, width);
            gradient.addColorStop(0, 'rgba(20, 20, 60, 0.1)');
            gradient.addColorStop(1, 'rgba(10, 10, 30, 0.5)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);
            
            // Update and draw hearts
            hearts.forEach(heart => {
                heart.update(time);
                heart.draw(ctx);
            });
            
            requestAnimationFrame(animate);
        }

        // Auto-adjust heart count based on screen size
        function adjustHeartCount() {
            const area = width * height;
            const baseArea = 1920 * 1080;
            const scale = area / baseArea;
            config.heartCount = Math.max(20, Math.floor(35 * scale));
            initHearts();
        }

        // Initialize and start animation
        adjustHeartCount();
        requestAnimationFrame(animate);
        
        // Re-adjust on resize
        window.addEventListener('resize', function() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            adjustHeartCount();
        });
    </script>
</body>
</html>

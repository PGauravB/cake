<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Hearts Live Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            background: #0a0a1a;
        }
        
        #hearts-canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="hearts-canvas"></canvas>

    <script>
        // Canvas setup
        const canvas = document.getElementById('hearts-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Configuration - Increased heart count and glow
        let config = {
            glowIntensity: 0.5,  // Increased glow
            pulseSpeed: 0.6,
            heartCount: 15,      // Many more hearts
            movementSpeed:1,  // Slower movement
            colors: [
                {r: 255, g: 0, b: 128},    // Bright pink
                {r: 255, g: 20, b: 147},   // Deep pink
                {r: 255, g: 105, b: 180},  // Hot pink
                {r: 219, g: 112, b: 147},  // Pale violet red
                {r: 199, g: 21, b: 133},   // Medium violet red
                {r: 255, g: 0, b: 0},      // Red
                {r: 255, g: 69, b: 0},     // Orange red
                {r: 255, g: 20, b: 100},   // Additional red
                {r: 255, g: 50, b: 150},   // Additional pink
                {r: 230, g: 30, b: 120}    // Additional magenta
            ]
        };

        // Heart class
        class Heart {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = 15 + Math.random() * 30;  // Smaller minimum size
                this.color = config.colors[Math.floor(Math.random() * config.colors.length)];
                this.glowIntensity = 0.7 + Math.random() * 0.8;  // Increased glow range
                this.pulseSpeed = 0.4 + Math.random() * 0.7;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.015;
                // More varied movement directions
                this.vx = (Math.random() - 0.5) * config.movementSpeed * (0.5 + Math.random() * 0.5);
                this.vy = (Math.random() - 0.5) * config.movementSpeed * (0.5 + Math.random() * 0.5);
                this.pulseOffset = Math.random() * Math.PI * 2;
                this.sizeVariation = 0.3 + Math.random() * 0.4;  // More size variation during pulse
            }
            
            update(time) {
                // Update position with boundary checking
                this.x += this.vx;
                this.y += this.vy;
                
                // Wrap around edges
                if (this.x < -this.size * 2) this.x = width + this.size * 2;
                if (this.x > width + this.size * 2) this.x = -this.size * 2;
                if (this.y < -this.size * 2) this.y = height + this.size * 2;
                if (this.y > height + this.size * 2) this.y = -this.size * 2;
                
                // Update rotation
                this.rotation += this.rotationSpeed;
                
                // Update pulse - using multiple sine waves for more complex pulsing
                const pulse1 = Math.sin(time * this.pulseSpeed + this.pulseOffset) * 0.5 + 0.5;
                const pulse2 = Math.sin(time * this.pulseSpeed * 1.7 + this.pulseOffset * 1.3) * 0.3 + 0.7;
                const combinedPulse = (pulse1 + pulse2) / 2;
                
                this.currentSize = this.size * (0.7 + combinedPulse * this.sizeVariation);
                this.currentGlow = this.glowIntensity * config.glowIntensity * (0.6 + combinedPulse * 0.4);
            }
            
            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                this.drawHeart(ctx);
                ctx.restore();
            }
            
            drawHeart(ctx) {
                const size = this.currentSize;
                const glowSize = size * 1.8;  // Larger glow area
                
                // Draw glow effect - larger and more intense
                const gradient = ctx.createRadialGradient(0, 0, size * 0.4, 0, 0, glowSize);
                gradient.addColorStop(0, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${0.9 * this.currentGlow})`);
                gradient.addColorStop(0.6, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, ${0.4 * this.currentGlow})`);
                gradient.addColorStop(1, `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0)`);
                
                ctx.beginPath();
                ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
                ctx.fillStyle = gradient;
                ctx.fill();
                
                // Draw heart shape
                ctx.beginPath();
                
                // Top curves of heart
                ctx.moveTo(0, -size/2);
                ctx.bezierCurveTo(size/2, -size, size, -size/3, 0, size/2);
                ctx.bezierCurveTo(-size, -size/3, -size/2, -size, 0, -size/2);
                
                // Fill heart with semi-transparency to show glow through
                ctx.fillStyle = `rgba(${this.color.r}, ${this.color.g}, ${this.color.b}, 0.85)`;
                ctx.fill();
                
                // Draw heart outline with glow
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = `rgba(255, 255, 255, 0.9)`;
                ctx.stroke();
                
                // Draw digital/holographic pattern inside heart
                this.drawHolographicPattern(ctx, size);
            }
            
            drawHolographicPattern(ctx, size) {
                // Create a dotted/holographic pattern
                const patternSize = size / 6;  // Smaller pattern for more detail
                const rows = Math.ceil(size / patternSize);
                const cols = Math.ceil(size / patternSize);
                
                ctx.save();
                
                // Clip to heart shape
                ctx.beginPath();
                ctx.moveTo(0, -size/2);
                ctx.bezierCurveTo(size/2, -size, size, -size/3, 0, size/2);
                ctx.bezierCurveTo(-size, -size/3, -size/2, -size, 0, -size/2);
                ctx.clip();
                
                // Draw dots with more density
                ctx.fillStyle = `rgba(255, 255, 255, 0.4)`;
                for (let i = -cols; i <= cols; i++) {
                    for (let j = -rows; j <= rows; j++) {
                        const x = i * patternSize;
                        const y = j * patternSize;
                        
                        // Check if point is within heart (approximation)
                        const distance = Math.sqrt(x*x + y*y);
                        if (distance < size/2) {
                            // Animated dot size for holographic effect
                            const timeFactor = Date.now() * 0.002;
                            const dotSize = 0.8 + Math.sin(i * 0.5 + j * 0.5 + timeFactor) * 0.7;
                            ctx.beginPath();
                            ctx.arc(x, y, dotSize, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                }
                
                ctx.restore();
            }
        }

        // Create hearts
        let hearts = [];
        function initHearts() {
            hearts = [];
            // Create many hearts with overlapping positions
            for (let i = 0; i < config.heartCount; i++) {
                hearts.push(new Heart());
            }
            
            // Add some extra small hearts in gaps
            for (let i = 0; i < 20; i++) {
                const smallHeart = new Heart();
                smallHeart.size = 8 + Math.random() * 12;
                hearts.push(smallHeart);
            }
        }

        // Add a subtle gradient overlay for depth
        function drawBackgroundGradient() {
            // Main background
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(0, 0, width, height);
            
            // Add multiple radial gradients for depth
            const centerX = width / 2;
            const centerY = height / 2;
            const maxRadius = Math.max(width, height);
            
            // Deep purple center glow
            const gradient1 = ctx.createRadialGradient(
                centerX, centerY, maxRadius * 0.1,
                centerX, centerY, maxRadius * 0.5
            );
            gradient1.addColorStop(0, 'rgba(80, 20, 100, 0.15)');
            gradient1.addColorStop(1, 'rgba(10, 10, 30, 0)');
            
            ctx.fillStyle = gradient1;
            ctx.fillRect(0, 0, width, height);
            
            // Blue edge glow
            const gradient2 = ctx.createRadialGradient(
                centerX, centerY, maxRadius * 0.3,
                centerX, centerY, maxRadius
            );
            gradient2.addColorStop(0, 'rgba(20, 20, 60, 0.1)');
            gradient2.addColorStop(1, 'rgba(5, 5, 15, 0.3)');
            
            ctx.fillStyle = gradient2;
            ctx.fillRect(0, 0, width, height);
        }

        // Animation loop
        function animate(time) {
            // Convert time to seconds
            time *= 0.001;
            
            // Draw background with gradients
            drawBackgroundGradient();
            
            // Update and draw hearts
            hearts.forEach(heart => {
                heart.update(time);
                heart.draw(ctx);
            });
            
            requestAnimationFrame(animate);
        }

        // Auto-adjust heart count based on screen size
        function adjustHeartCount() {
            const area = width * height;
            const baseArea = 1920 * 1080;
            const scale = Math.sqrt(area / baseArea); // Use square root for better scaling
            
            // More hearts for larger screens
            config.heartCount = Math.max(60, Math.floor(80 * scale));
            
            // Add extra hearts for very large screens
            if (scale > 1.5) {
                config.heartCount = Math.floor(config.heartCount * 1.3);
            }
            
            initHearts();
        }

        // Initialize and start animation
        adjustHeartCount();
        requestAnimationFrame(animate);
        
        // Re-adjust on resize
        window.addEventListener('resize', function() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            adjustHeartCount();
        });
    </script>
</body>
</html>
